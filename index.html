<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아이온 미션</title>
<meta name="description" content="우리 동네 소리 풍경 2차시 · 아이온 아이스크림 미션과 컬링 시합">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<style>
/* 놀이판 종이 느낌의 밝은 화면 하나(어두운 테마 없음). 왼쪽 안내판 + 가운데 3D 무대 + 아래 조종대 */
:root{
  --paper:#f3f1ea; --panel:#fff; --line:#e2ddd0; --ink:#1c2230; --muted:#596274;
  --yellow:#f2cf1d; --green:#3c9e3a; --red:#d9343b; --blue:#1b6bd0; --ok:#23824a; --bad:#c62828;
  --f-display:"Jua","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;padding:8px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* 입장 */
.join{max-width:760px;margin:20px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.join h1{font-family:var(--f-display);font-weight:400;font-size:36px;margin:0 0 4px}
.join p{margin:0 0 14px;color:var(--muted)}
.join h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:16px 0 8px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.pick button{border:2px solid var(--line);background:#faf8f2;border-radius:12px;padding:10px 0;font-family:var(--f-display);font-size:20px;cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.join .go{margin-top:18px;width:100%;font-size:22px;padding:12px}

/* 머리줄 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:8px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;line-height:1.1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 16px;cursor:pointer;font-family:var(--f-display);font-size:18px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab:disabled{opacity:.45;cursor:not-allowed}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.net i{width:10px;height:10px;border-radius:50%;background:#bbb;display:inline-block}
.net.on i{background:#2fbf5b}
.net.off i{background:var(--bad)}

/* 본문 */
.wrap{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:12px;align-items:start}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.box h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 4px}
.box .sub{margin:0 0 8px;color:var(--muted);font-size:14px}
.stagecol{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;background:#e9e5d8;border:1px solid var(--line);border-radius:14px;overflow:hidden;height:calc(100vh - 250px);min-height:300px}
.stage canvas{display:block;width:100%;height:100%}
.stage .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted)}
.viewbtn{position:absolute;right:10px;top:10px;border:none;background:rgba(255,255,255,.88);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.float{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.9);border-radius:12px;padding:6px 12px;font-family:var(--f-display);font-size:18px;pointer-events:none}

/* 주문서·카드 */
.orders{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.orders figure{margin:0;display:flex;flex-direction:column;align-items:center}
.orders figcaption{font-family:var(--f-display);font-size:17px}
.orders .tag{font-size:12px;color:var(--muted)}
.orders svg{width:100%;max-width:96px;height:auto;display:block}
.mtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.mtab{border:2px solid var(--line);background:#faf8f2;border-radius:999px;padding:2px 10px;font-size:14px;cursor:pointer}
.mtab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.mtab.cleared::after{content:" ✔";color:var(--ok)}
.mtab[aria-pressed="true"].cleared::after{color:#8be0a8}
.slots{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.slot{position:relative;width:54px;height:78px;border:2px dashed #b9b19c;border-radius:10px;display:grid;place-items:center;color:#a39a82;font-family:var(--f-display);font-size:20px;flex:none}
.slot.filled{border:none}
.slot.bad{animation:shake .5s}
.slot .badge{position:absolute;top:-9px;right:-9px;background:var(--ok);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px;z-index:2}
.slot .badge.badb{background:var(--bad)}
.arrow{color:#a39a82;font-size:14px;flex:none}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.tray{display:flex;gap:8px;flex-wrap:wrap;min-height:80px}
.card{width:54px;height:78px;border:none;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 2px 5px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.card:disabled{cursor:default}
.card svg{width:34px;height:34px}
.card span{font-size:11px;font-weight:700}
.t-cone{background:var(--yellow);color:#3a2c00}.t-green{background:var(--green);color:#fff}.t-red{background:var(--red);color:#fff}.t-blue{background:var(--blue);color:#fff}
.slot .card{box-shadow:none}
.cardtools{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.linkbtn{background:none;border:none;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:14px;padding:2px}
.linkbtn:disabled{color:#aaa;text-decoration:none;cursor:default}
.small{font-size:13px;color:var(--muted)}

/* 조종대 */
.console{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.ybtn{position:relative;width:86px;height:86px;border-radius:50%;border:none;background:none;cursor:pointer;padding:0;touch-action:none;user-select:none;-webkit-user-select:none}
.ybtn svg{width:86px;height:86px;display:block}
.ybtn .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;line-height:1.1;color:#3a2c00;text-align:center;pointer-events:none}
.ybtn:disabled{cursor:not-allowed}
.ybtn:disabled .face{fill:#e6dfb8}
.ybtn:disabled .lbl{color:#9d9576}
.ybtn.pulse:not(:disabled) .face{animation:pulse 1.4s ease-in-out infinite}
.ybtn.holding .face{fill:#ffe45c}
@keyframes pulse{0%,100%{fill:var(--yellow)}50%{fill:#ffe45c}}
.msg{min-width:0}
.msg .status{margin:0;font-weight:700;font-size:17px;line-height:1.45}
.msg .hint{margin:3px 0 0;color:var(--muted);font-size:14px}
.status.warn{color:var(--bad)} .status.good{color:var(--ok)}
.ctl{display:flex;flex-direction:column;gap:8px}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:12px;padding:8px 16px;cursor:pointer;font-family:var(--f-display);font-size:18px;white-space:nowrap}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* 컬링 */
.modes{display:flex;gap:6px;flex-wrap:wrap}
.mode{flex:1;border:2px solid var(--line);background:#faf8f2;border-radius:12px;padding:8px 6px;cursor:pointer;text-align:center;min-width:80px}
.mode b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px}
.mode span{font-size:12px;color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.mode[aria-pressed="true"] span{color:#d6dbe6}
.mode:disabled{opacity:.45;cursor:not-allowed}
.throws{display:flex;gap:6px;margin-top:8px}
.throws div{flex:1;border:2px dashed #cfc7b2;border-radius:10px;text-align:center;padding:4px 0;font-family:var(--f-display);font-size:20px;color:#a39a82}
.throws div.done{border-style:solid;border-color:var(--ink);color:var(--ink)}
.throws div small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.sum{margin-top:6px;font-weight:700}
.board{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.board th,.board td{padding:3px 4px;border-bottom:1px solid #eee;text-align:left}
.board th{color:var(--muted);font-weight:500;font-size:12px}
.board td.n{text-align:right;font-weight:700}
.board tr.mine td{background:#fff6cf}
.rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#eee;font-size:12px;font-weight:700}
.rank.r1{background:#f2cf1d}.rank.r2{background:#d9dde5}.rank.r3{background:#e8b98a}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.bandkey{display:flex;gap:2px;margin-top:6px}
.bandkey span{flex:1;text-align:center;font-size:12px;border-radius:4px;padding:1px 0;color:#fff;font-weight:700}

/* 알림·결과 */
.notice{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;border-radius:14px;padding:10px 18px;max-width:min(90vw,640px);box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:17px;display:flex;gap:12px;align-items:center}
.notice b{font-family:var(--f-display);font-weight:400;color:var(--yellow)}
.notice button{border:none;background:#ffffff22;color:#fff;border-radius:999px;padding:2px 10px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(20,24,32,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--panel);border-radius:18px;max-width:460px;width:100%;padding:20px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 6px}
.modal p{margin:6px 0}
.modal .algo{background:#fff6cf;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:15px;text-align:left}
.modal .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.modal svg{width:96px;height:auto}
.flying{position:fixed;z-index:50;margin:0;pointer-events:none;transition:transform .45s ease-in,opacity .25s;border-radius:10px}

/* 아이온 살펴보기 */
.pinfo{background:#fff6cf;border-radius:12px;padding:10px 12px;margin-top:8px;min-height:92px;font-size:15px}
.pinfo b{font-family:var(--f-display);font-weight:400;font-size:22px;display:block;margin-bottom:2px}
.pinfo .fb{font-weight:700;margin-top:4px}
.pinfo .fb.good{color:var(--ok)} .pinfo .fb.bad{color:var(--bad)}
.hsq{font-family:var(--f-display);font-size:26px;text-align:center;margin:6px 0 10px}
.hsrow{display:flex;gap:8px}
.hsrow .btn{flex:1;white-space:normal;line-height:1.2;font-size:18px;padding:8px 6px}
.hsrow .btn small{display:block;font-family:var(--f-body);font-size:12px;opacity:.85}
.hsfb{min-height:24px;margin:8px 0 0;font-weight:700;text-align:center}
.pdots{display:flex;gap:4px;margin-top:8px}
.pdots span{flex:1;height:8px;border-radius:4px;background:#e2ddd0}
.pdots span.ok{background:var(--ok)} .pdots span.no{background:var(--bad)}
@media (min-width:881px){ .parts-on .stage{height:calc(100vh - 110px)} }

@media (max-width:880px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .stage{height:56vh}
  .me{margin-left:0}
}
@media (max-width:480px){
  .console{grid-template-columns:auto minmax(0,1fr)}
  .ctl{grid-column:1 / -1;flex-direction:row}
  .ctl .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){ .ybtn.pulse .face{animation:none} .slot.bad{animation:none} }
</style>
</head>
<body>

<!-- 입장 -->
<section class="join" id="join" hidden>
  <h1>아이온 미션</h1>
  <p>우리 동네 소리 풍경 · 2차시. 내 모둠과 번호를 골라요. 이름은 쓰지 않아요.</p>
  <h2>모둠</h2>
  <div class="pick" id="pickTeam"></div>
  <h2>번호</h2>
  <div class="pick" id="pickNum"></div>
  <button class="btn go" id="joinBtn" type="button" disabled>들어가기</button>
</section>

<!-- 앱 -->
<div id="app" hidden>
  <header class="top">
    <h1>아이온 미션</h1>
    <nav class="tabs" role="tablist" aria-label="활동 고르기">
      <button class="tab" role="tab" id="tabParts" aria-selected="false" type="button">아이온 살펴보기</button>
      <button class="tab" role="tab" id="tabIce" aria-selected="true" type="button">아이스크림 미션</button>
      <button class="tab" role="tab" id="tabCurl" aria-selected="false" type="button">컬링 시합</button>
    </nav>
    <div class="me">
      <span class="net" id="net"><i></i><span>연결 중</span></span>
      <button class="chip" id="meBtn" type="button" title="모둠·번호 바꾸기"></button>
      <button class="chip" id="sndBtn" type="button">소리 끄기</button>
    </div>
  </header>

  <main class="wrap">
    <!-- 왼쪽: 아이스크림 -->
    <aside class="side" id="iceSide" aria-label="주문서와 카드">
      <div class="box">
        <div class="mtabs" id="mtabs"></div>
        <div class="orders">
          <figure><figcaption>주문서</figcaption><span class="tag" id="orderTag">이 모양 그대로</span><svg id="targetSvg" viewBox="0 0 120 210" role="img" aria-label="주문한 아이스크림"></svg></figure>
          <figure><figcaption>아이온이 만든 것</figcaption><span class="tag" id="madeTag">아직 없어요</span><svg id="madeSvg" viewBox="0 0 120 210" role="img" aria-label="아이온이 만든 아이스크림"></svg></figure>
        </div>
      </div>
      <div class="box">
        <h2 id="cardTitle">카드 순서</h2>
        <p class="sub" id="cardSub">먼저 올릴 재료부터 왼쪽 칸에 놓아요.</p>
        <div class="slots" id="slots"></div>
        <div class="tray" id="tray"></div>
        <div class="cardtools"><span class="small" id="countTxt"></span><button class="linkbtn" id="clearBtn" type="button">카드 다시 놓기</button></div>
      </div>
    </aside>

    <!-- 왼쪽: 컬링 -->
    <aside class="side" id="curlSide" aria-label="컬링 기록" hidden>
      <div class="box">
        <h2>경기 고르기</h2>
        <div class="modes" id="modes">
          <button class="mode" data-mode="practice" type="button"><b>연습</b><span>시간 보임 · 기록 안 됨</span></button>
          <button class="mode" data-mode="solo" type="button"><b>개인전</b><span>3번 던져 합산</span></button>
          <button class="mode" data-mode="team" type="button"><b>단체전</b><span>한 사람 2번 · 모둠 합산</span></button>
        </div>
        <div id="myThrows"></div>
      </div>
      <div class="box">
        <h2 id="boardTitle">실시간 순위</h2>
        <div id="boardBox"></div>
      </div>
    </aside>

    <!-- 왼쪽: 아이온 살펴보기 -->
    <aside class="side" id="partSide" aria-label="아이온 살펴보기" hidden>
      <div class="box">
        <h2>아이온 살펴보기</h2>
        <p class="sub">아이온을 눌러 부품 이름을 알아봐요. 끌면 돌려 볼 수 있어요.</p>
        <div class="modes" id="pModes">
          <button class="mode" data-p="look" type="button" aria-pressed="true"><b>살펴보기</b><span>눌러서 이름 보기</span></button>
          <button class="mode" data-p="quiz" type="button" aria-pressed="false"><b>찾기 퀴즈</b><span>부품 6개 찾기</span></button>
        </div>
        <div class="pinfo" id="pInfo" aria-live="polite"></div>
        <p class="small">그림은 실제 아이온과 조금 달라요. 내 아이온에서도 찾아봐요.</p>
      </div>
      <div class="box">
        <h2>하드웨어? 소프트웨어?</h2>
        <p class="sub">1차시에 배운 말이에요. 알맞은 쪽을 골라요.</p>
        <div id="hsBox"></div>
      </div>
    </aside>

    <section class="stagecol">
      <div class="stage" id="stage">
        <div class="float" id="floatTxt">아이스크림 미션</div>
        <button class="viewbtn" id="viewBtn" type="button">처음 시점</button>
      </div>

      <!-- 아이스크림 조종대 -->
      <div class="console" id="iceConsole">
        <button class="ybtn" id="yellow" type="button" aria-describedby="status">
          <svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46" fill="#2a2d33"/><circle class="face" cx="48" cy="48" r="36" fill="var(--yellow)"/><circle id="ring" cx="48" cy="48" r="41" fill="none" stroke="#3ccf6e" stroke-width="7" stroke-linecap="round" stroke-dasharray="257.6" stroke-dashoffset="257.6" transform="rotate(-90 48 48)"/></svg>
          <span class="lbl" id="ylbl">노란<br>버튼</span>
        </button>
        <div class="msg" aria-live="polite"><p class="status" id="status"></p><p class="hint" id="hint"></p></div>
        <div class="ctl"><button class="btn" id="insertBtn" type="button">카드 넣기</button><button class="btn ghost" id="resetBtn" type="button">처음부터</button></div>
      </div>

      <!-- 컬링 조종대 -->
      <div class="console" id="curlConsole" hidden>
        <button class="ybtn" id="cYellow" type="button" aria-describedby="cStatus">
          <svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46" fill="#2a2d33"/><circle class="face" cx="48" cy="48" r="36" fill="var(--yellow)"/></svg>
          <span class="lbl" id="cylbl">꾹<br>누르기</span>
        </button>
        <div class="msg" aria-live="polite"><p class="status" id="cStatus"></p><p class="hint" id="cHint"></p></div>
        <div class="ctl"><button class="btn ghost" id="cBack" type="button">출발점으로</button></div>
      </div>
    </section>
  </main>
</div>

<div class="notice" id="notice" hidden><b>선생님</b><span id="noticeTxt"></span><button type="button" id="noticeX">닫기</button></div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"></h3>
    <svg id="mSvg" viewBox="0 0 120 210" aria-hidden="true"></svg>
    <p id="mText"></p>
    <div class="algo" id="mAlgo"></div>

let renderer=null, camera, controls, activeScene=null, stageEl=$("#stage"), webgl=true;
const clock=new THREE.Clock();

function initThree(){

  }catch(e){ webgl=false; }

    const d=document.createElement("div"); d.className="fallback"; d.innerHTML="이 컴퓨터에서는 3D 화면을 켤 수 없어요.<br>크롬 브라우저로 열어 보거나 선생님께 알려 주세요.";

  stageEl.insertBefore(renderer.domElement,stageEl.firstChild);
  camera=new THREE.PerspectiveCamera(38,1,.1,200);
  controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.enablePan=false;
  controls.minPolarAngle=.25; controls.maxPolarAngle=1.25;
  buildIce(); buildCurl();
  activeScene=ice.scene;
  new ResizeObserver(resize).observe(stageEl); resize();
  renderer.setAnimationLoop(()=>{
    const dt=Math.min(clock.getDelta(),.05);
    tickers.forEach(f=>f(dt));
    controls.update();
    if(activeScene) renderer.render(activeScene,camera);
    if(snapWanted) takeSnap();
  });
}
function resize(){
  if(!renderer) return;
  const w=stageEl.clientWidth,h=stageEl.clientHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  resetView(true);
}
function fitView(target,width,depth,elev){
  // 가로 width·세로 depth 판이 화면에 들어오도록 카메라 거리 계산
  const vf=THREE.MathUtils.degToRad(camera.fov), hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);
  const dW=(width/2)/Math.tan(hf/2)*1.05, dD=(depth/2)/Math.tan(vf/2)*1.12;
  const d=Math.max(dW,dD);
  camera.position.set(target.x,target.y+Math.sin(elev)*d,target.z+Math.cos(elev)*d);
  controls.target.copy(target); controls.minDistance=d*.6; controls.maxDistance=d*1.5; controls.update();
}
function resetView(){
  if(!renderer) return;
  controls.maxPolarAngle=curTab==="parts"?1.5:1.25;
  if(curTab==="ice") fitView(new THREE.Vector3(0,0,.1),10.2,6.3,THREE.MathUtils.degToRad(58));
  else if(curTab==="parts"){
    fitView(new THREE.Vector3(.2,.45,0),4.9,3.3,THREE.MathUtils.degToRad(26));
    const off=camera.position.clone().sub(controls.target); off.applyAxisAngle(new THREE.Vector3(0,1,0),.8);
    camera.position.copy(controls.target).add(off); controls.update();
  }
  else fitView(new THREE.Vector3(4.6,0,.2),12.6,5.0,THREE.MathUtils.degToRad(48));
}

const waffleTex=(()=>{ const c=document.createElement("canvas"); c.width=c.height=128; const g=c.getContext("2d"); g.fillStyle="#e3a862"; g.fillRect(0,0,128,128); g.strokeStyle="#b47432"; g.lineWidth=5; for(let i=-128;i<256;i+=24){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+128,128); g.stroke(); g.beginPath(); g.moveTo(i+128,0); g.lineTo(i,128); g.stroke(); } const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,1); return t; })();

function makeRobot(){

    for(let i=0;i<11;i++){ const k=new THREE.Mesh(new THREE.BoxGeometry(.035,.02,.2),tread); k.position.set(-.42+i*.084,.225,s*.36); r.add(k); }
    for(let i=0;i<2;i++){ const w=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.21,16),new THREE.MeshStandardMaterial({color:0x9aa0a8,roughness:.4,metalness:.3})); w.rotation.x=Math.PI/2; w.position.set(i?.34:-.34,.11,s*.36+s*.005); r.add(w); }
  });
  const body=new THREE.Mesh(new RoundedBoxGeometry(.78,.3,.54,3,.06),new THREE.MeshStandardMaterial({color:0xf4f3ef,roughness:.5}));
  body.position.y=.31; body.castShadow=true; body.receiveShadow=true; r.add(body);
  const studM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.45});
  for(let i=0;i<5;i++) for(let j=0;j<3;j++){ const st=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.04,14),studM); st.position.set(-.28+i*.12,.48,-.15+j*.15); st.castShadow=true; r.add(st); }
  const panel=new THREE.Mesh(new THREE.BoxGeometry(.05,.2,.34),dark); panel.position.set(.4,.3,0); r.add(panel);
  const leds=[0xe9625b,0xf2cf1d,0x7cc36a].map((c,i)=>{ const m=new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.25}); const l=new THREE.Mesh(new THREE.SphereGeometry(.025,10,8),m); l.position.set(.428,.33,-.08+i*.08); r.add(l); return m; });
  const yb=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.04,18),new THREE.MeshStandardMaterial({color:0xf2cf1d,roughness:.4})); yb.position.set(.3,.48,.2); r.add(yb);
  const rb=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.04,18),new THREE.MeshStandardMaterial({color:0xd9343b,roughness:.4})); rb.position.set(.3,.48,-.2); r.add(rb);
  const top=new THREE.Group(); top.position.set(-.05,.5,0); r.add(top);
  r.userData={leds:leds,top:top,ybtn:yb};
  return r;
}

const ring=$("#ring"), RING=257.6; let hold=null;
function holdStart(e){ if(e) e.preventDefault(); AC(); if(st.busy||st.phase==="go") return; if(!(st.phase==="think"&&seqDone())) return;
  const t0=performance.now(); let ticked=false; hold={t0,raf:0}; $("#yellow").classList.add("holding");
  const step=now=>{ if(!hold) return; const ms=now-t0, k=Math.min(1,ms/2000); ring.setAttribute("stroke-dashoffset",(RING*(1-k)).toFixed(1)); if(ms>=2000&&!ticked){ ticked=true; snd.tick(); setMsg("지금 손을 떼요!","",""); } if(ms<2000) setMsg("꾹… "+(ms/1000).toFixed(1)+"초","2초가 되면 손을 떼요.",""); if(ms>4500) ring.setAttribute("stroke","#d9343b"); hold.raf=requestAnimationFrame(step); };
  hold.raf=requestAnimationFrame(step); }
function holdEnd(e){ if(e) e.preventDefault(); $("#yellow").classList.remove("holding"); if(st.phase==="go"&&!st.busy){ run(); return; } if(!hold) return; const ms=performance.now()-hold.t0; cancelAnimationFrame(hold.raf); hold=null; ring.setAttribute("stroke-dashoffset",RING); ring.setAttribute("stroke","#3ccf6e");
  if(ms<1800) setMsg("조금 더 길게 눌러요. 2초 동안 꾹!","짧게 누르면 진짜 아이온도 준비가 되지 않아요.","warn");
  else if(ms>4500) setMsg("너무 오래 눌렀어요. 2초만 누르고 손을 떼요.","진짜 아이온은 오래 누르면 불빛이 켜지며 다른 놀이(내장 프로그램)로 바뀌어요.","warn");
  else ready(); }
function holdCancel(){ if(!hold) return; cancelAnimationFrame(hold.raf); hold=null; $("#yellow").classList.remove("holding"); ring.setAttribute("stroke-dashoffset",RING); ring.setAttribute("stroke","#3ccf6e"); customMsg=null; paintMsg(); }

/* 3) 출발 */
async function run(){
  if(st.busy||st.phase!=="go") return; AC();
  st.busy=true; st.phase="run"; customMsg=null; st.made=[]; renderMade(false); render();
  let cur="S"; const used=new Set(); const top=ice.robot.userData.top; top.clear(); let stackY=0;
  for(const t of st.seq){
    const idx=ice.graph.items.findIndex((it,j)=>it.t===t&&!used.has(j)); if(idx<0) continue; used.add(idx);
    const it=ice.graph.items[idx], path=shortest(ice.graph,cur,it.node);
    for(let j=1;j<path.length;j++){ const p=ice.graph.nodes[path[j]]; await turnTo(Math.atan2(p.y-ice.rb.y,p.x-ice.rb.x)*180/Math.PI); await moveTo(p); }
    cur=it.node;
    const o=ice.items[idx]; o.userData.taken=true; snd.pop();
    const from=o.position.clone();
    // 로봇 위로 날아가 쌓이기
    const coneFirst=st.made.length===0?t==="cone":st.made[0]==="cone";
    await tween(520,k=>{ const tp=top.getWorldPosition(new THREE.Vector3()); o.position.set(from.x+(tp.x-from.x)*k,from.y+(tp.y+stackY-from.y)*k+Math.sin(k*Math.PI)*.8,from.z+(tp.z-from.z)*k); o.rotation.y+=.2; });
    ice.scene.remove(o); o.position.set(0,stackY,0); o.rotation.set(t==="cone"&&st.made.length>0?Math.PI:0,0,0);
    if(t==="cone"&&st.made.length>0) o.position.y=stackY+.42;
    o.scale.setScalar(.95); top.add(o);
    stackY+=(t==="cone"?(st.made.length===0?.32:.36):.2);
    st.made.push(t); renderMade(false); await wait(150);
  }
  await wait(300); finish();
}

function scoreAt(x){ if(x>FIELD.x1) return 0; for(const b of BANDS){ if(x>=b.a&&x<b.b) return b.s; } return x<BANDS[0].a?5:0; }
function buildCurl(){
  const s=curl.scene=baseScene(0xcfe6f5);

  const L=FIELD.x1-FIELD.x0, c=document.createElement("canvas"); c.width=2320; c.height=560; const g=c.getContext("2d"); const sx=c.width/L, toPx=x=>(x-FIELD.x0)*sx;
  const grd=g.createLinearGradient(0,0,0,c.height); grd.addColorStop(0,"#c7e7a8"); grd.addColorStop(1,"#9fd27a"); g.fillStyle=grd; g.fillRect(0,0,c.width,c.height);
  BANDS.forEach((b,i)=>{ const x0=toPx(b.a),x1=toPx(b.b); g.fillStyle=b.c; g.globalAlpha=b.s===0?.35:(b.s>=8?.55:.18); g.fillRect(x0,0,x1-x0,c.height); g.globalAlpha=1; g.fillStyle=b.c; g.fillRect(x0,c.height-92,x1-x0,92); g.strokeStyle="#ffffff"; g.lineWidth=4; g.beginPath(); g.moveTo(x0,0); g.lineTo(x0,c.height); g.stroke(); g.fillStyle="#fff"; g.font="bold 64px Jua, 'Malgun Gothic', sans-serif"; g.textAlign="center"; g.fillText(String(b.s),(x0+x1)/2,c.height-24); });
  g.strokeStyle="#ffffff"; g.setLineDash([22,16]); g.lineWidth=6; g.beginPath(); g.moveTo(toPx(FIELD.x0),c.height/2-40); g.lineTo(toPx(FIELD.x1),c.height/2-40); g.stroke(); g.setLineDash([]);
  g.fillStyle="#2f5d1e"; g.font="bold 46px Jua, 'Malgun Gothic', sans-serif"; g.textAlign="left"; g.fillText("컬링 출발점",toPx(-1.05),70);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const field=new THREE.Mesh(new THREE.BoxGeometry(L,.03,FIELD.w),[0,0,new THREE.MeshStandardMaterial({map:tex,roughness:.95}),0,0,0].map(x=>x||new THREE.MeshStandardMaterial({color:0xf2eee2})));
  field.position.set((FIELD.x0+FIELD.x1)/2,-.015,0); field.receiveShadow=true; s.add(field);
  // 나무·집·깃발
  const trunk=new THREE.MeshStandardMaterial({color:0x8a5a33,roughness:1}), leaf=new THREE.MeshStandardMaterial({color:0x3f8f3a,roughness:.9}), leaf2=new THREE.MeshStandardMaterial({color:0x5aa845,roughness:.9});
  const tree=(x,z,h)=>{ const t=new THREE.Group(); const tr=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,h*.35,8),trunk); tr.position.y=h*.175; t.add(tr); const a=new THREE.Mesh(new THREE.ConeGeometry(h*.28,h*.7,9),Math.random()<.5?leaf:leaf2); a.position.y=h*.6; t.add(a); t.position.set(x,0,z); t.traverse(o=>{if(o.isMesh)o.castShadow=true}); s.add(t); };
  for(let i=0;i<10;i++){ tree(-1.4+i*1.35+Math.random()*.4,-2.1-Math.random()*1.2,1+Math.random()*.7); } [-2.6,-2.2,12.6,13.2].forEach((x,i)=>tree(x,(i%2?1.4:-.6),.9+Math.random()*.5));
  const house=new THREE.Group(); const wall=new THREE.Mesh(new THREE.BoxGeometry(1,.7,1),new THREE.MeshStandardMaterial({color:0xf3e1c4})); wall.position.y=.35; house.add(wall); const roof=new THREE.Mesh(new THREE.ConeGeometry(.85,.55,4),new THREE.MeshStandardMaterial({color:0xc0392b})); roof.position.y=.97; roof.rotation.y=Math.PI/4; house.add(roof); house.position.set(11.6,0,-.3); house.traverse(o=>{if(o.isMesh){o.castShadow=true;}}); s.add(house);
  const flag=new THREE.Group(); const pole=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,1.1,8),new THREE.MeshStandardMaterial({color:0xdddddd})); pole.position.y=.55; flag.add(pole); const cloth=new THREE.Mesh(new THREE.PlaneGeometry(.38,.24),new THREE.MeshStandardMaterial({color:0xd9343b,side:THREE.DoubleSide})); cloth.position.set(.19,.98,0); flag.add(cloth); flag.position.set(8.7,0,-FIELD.w/2-.05); s.add(flag);
  curl.robot=makeRobot(); curl.robot.position.set(0,0,0); s.add(curl.robot);
  // 지난 기록 표시 말뚝
  curl.marks=new THREE.Group(); s.add(curl.marks);
  tickers.add(dt=>{ ledBlink(curl.robot,curl.holding||curl.moving); cloth.rotation.y=Math.sin(performance.now()/400)*.25; });
}
function myThrows(mode){ const m=(curlData[mode]||{})[sid()]||{}; return Object.keys(m).map(k=>m[k]).sort((a,b)=>a.t-b.t); }
let localThrows={solo:[],team:[]};
function throwsFor(mode){ return FB.ok?myThrows(mode):localThrows[mode]; }
function renderModes(){
  document.querySelectorAll("#modes .mode").forEach(b=>{ const md=b.dataset.mode; b.disabled=!settings[md]||curl.moving; b.setAttribute("aria-pressed",curl.mode===md?"true":"false"); b.onclick=()=>{ if(!settings[md]||curl.moving) return; curl.mode=md; curl.last=null; renderModes(); renderMyThrows(); renderBoard(); paintCurl(); }; });
}
function renderMyThrows(){
  const box=$("#myThrows"); if(!box) return; box.textContent="";
  if(!curl.mode||curl.mode==="practice"){ if(curl.mode==="practice"){ const p=document.createElement("p"); p.className="small"; p.style.margin="8px 0 0"; p.textContent="연습은 기록에 남지 않아요. 누른 시간이 화면에 보여요."; box.appendChild(p); } return; }
  const lim=LIMIT[curl.mode], list=throwsFor(curl.mode);
  const row=document.createElement("div"); row.className="throws";
  for(let i=0;i<lim;i++){ const d=document.createElement("div"); const t=list[i]; if(t){ d.className="done"; d.innerHTML=t.s+"<small>"+(t.ms/1000).toFixed(2)+"초</small>"; } else { d.innerHTML=(i+1)+"<small>번째</small>"; } row.appendChild(d); }
  box.appendChild(row);
  const sum=document.createElement("div"); sum.className="sum"; sum.textContent="내 합계 "+list.slice(0,lim).reduce((a,t)=>a+t.s,0)+"점"+(curl.mode==="team"?" (모둠 점수에 더해져요)":""); box.appendChild(sum);
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function soloRanking(){
  const d=curlData.solo||{}, rows=[];
  Object.keys(d).forEach(k=>{ const list=Object.values(d[k]||{}).sort((a,b)=>a.t-b.t).slice(0,3); if(!list.length) return; rows.push({k,team:list[0].team,num:list[0].num,n:list.length,total:list.reduce((a,t)=>a+t.s,0),scores:list.map(t=>t.s)}); });
  rows.sort((a,b)=>b.total-a.total||b.n-a.n); return rows;
}
function teamRanking(){
  const d=curlData.team||{}, map={};
  Object.keys(d).forEach(k=>{ const list=Object.values(d[k]||{}).sort((a,b)=>a.t-b.t).slice(0,2); if(!list.length) return; const tm=list[0].team; map[tm]=map[tm]||{team:tm,members:0,n:0,total:0}; map[tm].members++; map[tm].n+=list.length; map[tm].total+=list.reduce((a,t)=>a+t.s,0); });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}
function renderBoard(){
  const box=$("#boardBox"); if(!box) return;
  const showTeam=curl.mode==="team";
  $("#boardTitle").textContent=showTeam?"실시간 순위 · 단체전(모둠)":"실시간 순위 · 개인전";
  if(!FB.ok){ box.innerHTML='<p class="empty">선생님 화면과 연결되지 않아 순위를 볼 수 없어요.</p>'; return; }
  let html='<table class="board"><thead><tr>';
  if(showTeam){ const rows=teamRanking().slice(0,8); html+='<th>순위</th><th>모둠</th><th>던짐</th><th style="text-align:right">합계</th></tr></thead><tbody>'; if(!rows.length) return box.innerHTML='<p class="empty">아직 단체전 기록이 없어요.</p>'; rows.forEach((r,i)=>{ html+='<tr class="'+(r.team===me.team?"mine":"")+'"><td><span class="rank r'+(i+1)+'">'+(i+1)+'</span></td><td>'+esc(r.team)+'모둠 ('+r.members+'명)</td><td>'+r.n+'</td><td class="n">'+r.total+'</td></tr>'; }); }
  else { const rows=soloRanking().slice(0,8); html+='<th>순위</th><th>누구</th><th>점수</th><th style="text-align:right">합계</th></tr></thead><tbody>'; if(!rows.length) return box.innerHTML='<p class="empty">아직 개인전 기록이 없어요. 첫 기록을 남겨 볼까요?</p>'; rows.forEach((r,i)=>{ html+='<tr class="'+(r.k===sid()?"mine":"")+'"><td><span class="rank r'+(i+1)+'">'+(i+1)+'</span></td><td>'+esc(r.team)+'모둠 '+esc(r.num)+'번</td><td>'+r.scores.join(" · ")+'</td><td class="n">'+r.total+'</td></tr>'; }); }
  box.innerHTML=html+"</tbody></table>";
}
function paintCurl(){
  const btn=$("#cYellow"), s=$("#cStatus"), h=$("#cHint");
  let can=!!curl.mode&&settings[curl.mode]&&!curl.moving;
  if(curl.mode&&curl.mode!=="practice"&&throwsFor(curl.mode).length>=LIMIT[curl.mode]) can=false;
  btn.disabled=!can; btn.classList.toggle("pulse",can&&!curl.holding);
  $("#cBack").disabled=curl.moving;
  s.className="status";
  if(!curl.mode){ s.textContent="왼쪽에서 연습·개인전·단체전 중 하나를 골라요."; h.textContent="연습으로 몇 초에 몇 점인지 먼저 알아봐요."; return; }
  if(!settings[curl.mode]){ s.textContent="선생님이 아직 열지 않았어요."; h.textContent=""; return; }
  if(curl.moving){ s.textContent="아이온이 앞으로 가는 중…"; h.textContent=""; return; }
  if(curl.holding){ s.textContent="누르고 있어요… 원하는 만큼 누르고 손을 떼요!"; h.textContent=curl.mode==="practice"?"":"시간은 마음속으로 세어 봐요."; return; }
  if(curl.mode!=="practice"&&throwsFor(curl.mode).length>=LIMIT[curl.mode]){ s.className="status good"; s.textContent=(curl.mode==="solo"?"개인전 3번":"단체전 2번")+"을 다 던졌어요! 순위를 확인해요."; h.textContent="다시 하려면 선생님께 말씀드려요."; return; }
  if(curl.last){ s.className="status good"; s.textContent=curl.last; h.textContent="노란 버튼을 다시 꾹 누르면 출발점에서 또 던져요."; return; }
  s.textContent="노란 버튼을 길게 눌렀다가 떼면, 누른 시간만큼 아이온이 앞으로 가요."; h.textContent="10점 칸은 아주 좁아요. 0점 칸까지 가면 0점!";
}
function cHoldStart(e){ if(e) e.preventDefault(); AC(); const b=$("#cYellow"); if(b.disabled||curl.holding||curl.moving) return;
  if(curl.robot.position.x>.01){ curl.robot.position.x=0; }
  curl.holding=true; curl.holdT0=performance.now(); b.classList.add("holding"); paintCurl();
  const step=()=>{ if(!curl.holding) return; const ms=performance.now()-curl.holdT0; if(curl.mode==="practice") $("#cylbl").textContent=(ms/1000).toFixed(1)+"초"; if(ms>6000){ cHoldEnd(); return; } requestAnimationFrame(step); }; requestAnimationFrame(step); }
async function cHoldEnd(e){ if(e) e.preventDefault(); if(!curl.holding) return; curl.holding=false; $("#cYellow").classList.remove("holding"); $("#cylbl").innerHTML="꾹<br>누르기";
  const ms=Math.min(6000,Math.round(performance.now()-curl.holdT0));
  if(ms<150){ curl.last="너무 짧게 눌렀어요. 꾹 눌렀다 떼요."; paintCurl(); return; }
  const mode=curl.mode;
  const dist=ms/1000*SPEED*(1+(Math.random()*.04-.02));
  const r=curl.robot, x0=0, x1=Math.min(dist,FIELD.x1+.6);
  let s=scoreAt(x1); const out=dist>FIELD.x1;
  const rec={team:me.team,num:me.num,ms,d:Math.round(x1*100)/100,s,t:Date.now()};
  curl.moving=true; renderModes(); paintCurl();
  if(mode!=="practice"){ if(FB.ok){ fbPush("curl/"+mode+"/"+sid(),rec); } else { localThrows[mode].push(rec); } }
  await tween(Math.max(300,ms),k=>{ r.position.x=x0+(x1-x0)*k; });
  if(out){ await tween(400,k=>{ r.position.y=-k*.3; r.rotation.z=-k*.4; }); }
  snd[s>=8?"win":(s===0?"oops":"ding")]();
  const mk=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.35,10),new THREE.MeshStandardMaterial({color:s>=8?0xd9343b:0xffffff})); mk.position.set(Math.min(x1,FIELD.x1),.17,(Math.random()-.5)*.6); curl.marks.add(mk); if(curl.marks.children.length>8) curl.marks.remove(curl.marks.children[0]);
  curl.last=(out?"밖으로 나갔어요! ":"")+(ms/1000).toFixed(2)+"초 눌러서 "+x1.toFixed(1)+"칸 → "+s+"점";
  await wait(900);
  if(out){ r.position.y=0; r.rotation.z=0; }
  curl.moving=false; renderModes(); renderMyThrows(); renderBoard(); paintCurl();
}
async function cBack(){ if(curl.moving) return; const r=curl.robot, x=r.position.x; if(x<.01) return; curl.moving=true; paintCurl(); await tween(500,k=>{ r.position.x=x*(1-ease(k)); r.position.y=Math.sin(k*Math.PI)*.5; }); r.position.set(0,0,0); curl.moving=false; paintCurl(); }
const cy=$("#cYellow");
cy.addEventListener("pointerdown",e=>{ if(e.button!==0&&e.pointerType==="mouse") return; try{cy.setPointerCapture(e.pointerId)}catch(x){} cHoldStart(e); });
cy.addEventListener("pointerup",cHoldEnd); cy.addEventListener("pointercancel",cHoldEnd); cy.addEventListener("contextmenu",e=>e.preventDefault());
cy.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&!e.repeat) cHoldStart(e); });
cy.addEventListener("keyup",e=>{ if(e.key===" "||e.key==="Enter") cHoldEnd(e); });
$("#cBack").addEventListener("click",cBack);

/* ───── 시작 ───── */
if(me.team&&me.num){ $("#app").hidden=false; startApp(false); } else { $("#join").hidden=false; buildJoin(); }
window.__aion={st,curl,settings:()=>settings,FB};
